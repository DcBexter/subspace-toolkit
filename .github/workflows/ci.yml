name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
    - cron: '11 6 * * 1'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name != 'schedule' || github.event.schedule == '11 6 * * 1'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --bin subspace-toolkit -- -D warnings
      - name: Tests without game files
        run: cargo test --locked --bin subspace-toolkit
      - name: Build Windows application
        run: cargo build --locked --release --bin subspace-toolkit
      - name: Build loader payload and mod without game files
        run: ./scripts/prepare-loader.ps1
      - name: Build independent live trainer runtime
        run: ./scripts/prepare-live.ps1
      - name: Check live hook activation and restoration
        run: |
          cargo build --manifest-path live/host/Cargo.toml --locked --example fixture --target-dir target/live-host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build live/Checks -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dist/SubspaceToolkit/live/runtime/dotnet.exe live/Checks/bin/Release/net6.0/Checks.dll dist/SubspaceToolkit/live target/live-host/debug/examples/fixture.dll
      - name: Check mod settings and file conflict recovery
        run: dotnet run --project scripts/check-mod -c Release
      - name: Check packaged installer in temporary folder
        run: |
          $env:SUBSPACE_TEST_PAYLOAD = (Resolve-Path dist/SubspaceToolkit/payload).Path
          cargo test --locked --bin subspace-toolkit release_payload_installs -- --ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($release in @(
            @{version='0.1.0'; hash='52d3624c4e9322296c2f3517161b8b14d1e8a0038c799bedb65d0af73b3a9e34'},
            @{version='0.1.1'; hash='514f6d707a1385fc1ae794357d80a074afb80c9b8e09fab1e2c2948d07ce4948'}
          )) {
            $version = $release.version
            $previous = "dist/downloads/SubspaceToolkit-$version-windows-x64.zip"
            if (!(Test-Path $previous)) { Invoke-WebRequest "https://github.com/DcBexter/subspace-toolkit/releases/download/v$version/SubspaceToolkit-$version-windows-x64.zip" -OutFile $previous }
            if ((Get-FileHash $previous).Hash.ToLowerInvariant() -ne $release.hash) { throw 'Previous release checksum mismatch' }
            Expand-Archive $previous "dist/previous-$version"
            $env:SUBSPACE_TEST_OLD_MOD = (Resolve-Path "dist/previous-$version/payload/Mods/SubspaceToolkit.dll").Path
            cargo test --locked --bin subspace-toolkit known_mod_upgrades -- --ignored
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Package portable application
        run: |
          New-Item -ItemType Directory -Path dist/SubspaceToolkit/locales -Force | Out-Null
          Copy-Item target/release/subspace-toolkit.exe dist/SubspaceToolkit/
          Copy-Item locales/*.json dist/SubspaceToolkit/locales/
          Copy-Item README.md dist/SubspaceToolkit/
          $package = (Resolve-Path dist/SubspaceToolkit).Path
          Get-ChildItem -LiteralPath $package -Recurse -File | Where-Object Name -ne SHA256SUMS.txt | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($package, $_.FullName).Replace('\', '/')
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $relative
          } | Set-Content dist/SubspaceToolkit/SHA256SUMS.txt -Encoding utf8
      - name: Upload portable application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SubspaceToolkit-windows-x64
          path: dist/SubspaceToolkit/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RustSec auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Check locked dependencies
        run: cargo audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
