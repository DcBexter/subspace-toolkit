name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'
    - cron: '11 6 * * 1'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name != 'schedule' || github.event.schedule == '11 6 * * 1'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --bin subspace-toolkit -- -D warnings
      - name: Tests without game files
        run: cargo test --locked --bin subspace-toolkit
      - name: Build Windows application
        run: cargo build --locked --release --bin subspace-toolkit
      - name: Package portable application
        run: |
          New-Item -ItemType Directory -Path dist/SubspaceToolkit/locales -Force | Out-Null
          Copy-Item target/release/subspace-toolkit.exe dist/SubspaceToolkit/
          Copy-Item locales/*.json dist/SubspaceToolkit/locales/
          Copy-Item README.md dist/SubspaceToolkit/
          $artifactHash = (Get-FileHash dist/SubspaceToolkit/subspace-toolkit.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactHash  subspace-toolkit.exe" | Set-Content dist/SubspaceToolkit/SHA256SUMS.txt -Encoding utf8
      - name: Upload portable application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SubspaceToolkit-windows-x64
          path: dist/SubspaceToolkit/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install RustSec auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Check locked dependencies
        run: cargo audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
