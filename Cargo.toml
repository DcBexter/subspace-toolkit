[package]
name = "subspace-toolkit"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
sha2 = "=0.11.1"
serde_json = "=1.0.154"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug"] }

[profile.release]
strip = true
lto = "thin"
